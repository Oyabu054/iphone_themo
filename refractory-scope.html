<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>REFRACTORY SCOPE — 二色比温度分布モニタ</title>
<style>
  @font-face {
    font-family: 'system-mono';
    src: local('SF Mono'), local('Menlo'), local('Consolas');
  }
  :root{
    --bg: #101214;
    --panel: #1a1d21;
    --panel-2: #23272c;
    --line: #33383e;
    --text: #e9e6df;
    --text-dim: #8a9096;
    --amber: #ff7a3d;
    --amber-dim: #ff7a3d55;
    --steel: #5fa8c4;
    --steel-dim: #5fa8c455;
    --danger: #e0483e;
    --radius: 2px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Top HUD ---------- */
  #hud {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-family: 'system-mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  #hud .brand {
    color: var(--amber);
    font-weight: 700;
    font-size: 12px;
  }
  #hud .brand::before { content: "◆ "; }
  #hud .status { display: flex; gap: 14px; align-items: center; }
  #hud .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim); display: inline-block; margin-right: 5px;
  }
  #hud .dot.live { background: var(--danger); box-shadow: 0 0 6px var(--danger); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- Stage (video / canvas) ---------- */
  #stage {
    position: relative;
    isolation: isolate;
    z-index: 0;
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #video, #viewCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    z-index: 1;
  }
  #video { pointer-events: none; transform-origin: center center; }
  #video.hidden { display: none; }
  #viewCanvas.hidden { display: none; }

  #reticle {
    position: absolute;
    width: 22px; height: 22px;
    border: 1px solid var(--amber);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.001);
  }
  #reticle::before, #reticle::after {
    content: ""; position: absolute; background: var(--amber);
  }
  #reticle::before { width: 1px; height: 8px; left: 50%; top: -10px; transform: translateX(-50%); }
  #reticle::after  { width: 1px; height: 8px; left: 50%; bottom: -10px; transform: translateX(-50%); }

  #probeReadout {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(16,18,20,0.82);
    border: 1px solid var(--line);
    padding: 8px 10px;
    font-family: 'system-mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--steel);
    display: none;
    pointer-events: none;
    min-width: 132px;
  }
  #probeReadout .lbl { color: var(--text-dim); }
  #probeReadout .big { font-size: 15px; color: var(--text); font-weight: 700; }
  /* warn when the numerator channel is down in the sensor noise floor, where
     the ratio is dominated by quantization rather than by temperature */
  #probeRGB.lowSignal { color: var(--danger); }

  #zoomReadout {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(16,18,20,0.82);
    border: 1px solid var(--line);
    padding: 4px 10px;
    font-family: 'system-mono', monospace;
    font-size: 11px;
    color: var(--amber);
    display: none;
    pointer-events: none;
  }

  #emptyHint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    line-height: 1.7;
    pointer-events: none;
  }

  /* ---------- Legend ---------- */
  #legend {
    position: absolute;
    right: 12px; top: 12px; bottom: 12px;
    width: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  #legendBar {
    flex: 1; width: 10px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  #legend .tag {
    font-family: 'system-mono', monospace;
    font-size: 9px; color: var(--text-dim);
    writing-mode: vertical-rl;
    margin: 4px 0;
    letter-spacing: 0.1em;
  }

  /* ---------- Bottom control panel ---------- */
  #controls {
    position: relative;
    z-index: 10;
    flex: 0 0 auto;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  #controls button {
    touch-action: manipulation;
    cursor: pointer;
  }
  .rowline {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 7px;
  }
  #camRow { gap: 8px; }
  #camRow.hidden-el { display: none !important; }
  .modeToggle {
    display: flex; gap: 6px;
    font-family: 'system-mono', monospace;
    font-size: 11px;
  }
  .modeToggle button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: var(--radius);
  }
  .modeToggle button.active {
    color: var(--bg);
    background: var(--steel);
    border-color: var(--steel);
    font-weight: 700;
  }
  .miniLabel {
    font-family: 'system-mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #analysisRow { gap: 8px; }
  #analysisRow .modeToggle button { padding: 5px 8px; }
  #zoomRow { display: flex; align-items: center; gap: 10px; }
  #zoomSlider { flex: 1; accent-color: var(--amber); }
  #zoomSlider:disabled { opacity: .35; }
  #fusionRow { display: flex; align-items: center; gap: 10px; }
  #fusionSlider { flex: 1; accent-color: var(--amber); }
  #brightnessRow { display: flex; align-items: center; gap: 10px; }
  #brightnessSlider { flex: 1; accent-color: var(--steel); }

  #shutterRow {
    display: flex; align-items: center; justify-content: center;
    gap: 26px;
    margin-top: 6px;
  }
  .iconBtn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  #shutterBtn {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: var(--amber);
    border: 4px solid #ffb08a;
    box-shadow: 0 0 0 2px var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #shutterBtn:active { background: #e5622a; }
  #shutterBtn.analyzing { background: var(--panel-2); border-color: var(--line); }
  #shutterIcon { display: none; font-size: 28px; line-height: 1; color: var(--bg); pointer-events: none; }
  #shutterBtn.retake {
    background: var(--steel);
    border-color: #a9d6e6;
  }
  #shutterBtn.retake:active { background: #4a90ab; }
  #shutterBtn.retake #shutterIcon { display: block; }

  .hidden-el { display: none !important; }

  #toast {
    position: fixed; left: 50%; bottom: 130px;
    transform: translateX(-50%);
    background: rgba(20,22,24,0.95);
    border: 1px solid var(--line);
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text);
    border-radius: var(--radius);
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none !important;
    z-index: 50;
  }
  #toast.show { opacity: 1; }

  a#dlLink { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="brand">REFRACTORY SCOPE</div>
    <div class="status">
      <span id="modeReadout">MODE: R/G</span>
      <span><span class="dot" id="liveDot"></span><span id="stateText">STANDBY</span></span>
    </div>
  </div>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="viewCanvas" class="hidden"></canvas>
    <canvas id="workCanvas" class="hidden-el"></canvas>

    <div id="reticle"></div>
    <div id="zoomReadout">1.0×</div>
    <div id="probeReadout">
      <div class="lbl">RATIO (raw)</div>
      <div class="big" id="probeRatio">--</div>
      <div class="lbl" style="margin-top:6px;">REL. LEVEL</div>
      <div class="big" id="probeLevel">--</div>
      <div class="lbl" style="margin-top:6px;">SENSOR R/G/B</div>
      <div id="probeRGB">--</div>
    </div>

    <div id="legend">
      <span class="tag">HIGH</span>
      <div id="legendBar"></div>
      <span class="tag">LOW</span>
    </div>

    <div id="emptyHint">
      カメラを起動し、レンガ面を画角に収めてシャッターを押してください。<br>
      露出・ホワイトバランスが自動調整されるため、撮影のたびに条件が変わります。<br>
      同一条件での比較には、毎回同じ距離・角度・照明で撮影してください。
    </div>
  </div>

  <div id="controls">
    <div class="rowline">
      <div class="modeToggle">
        <button type="button" id="modeRG" class="active">R / G</button>
        <button type="button" id="modeRB">R / B</button>
      </div>
      <div class="modeToggle" id="clipGroup">
        <button type="button" data-lo="0.005" data-hi="0.995">弱</button>
        <button type="button" data-lo="0.02" data-hi="0.98" class="active">標準</button>
        <button type="button" data-lo="0.10" data-hi="0.90">強</button>
      </div>
    </div>

    <div class="rowline hidden-el" id="camRow">
      <span class="miniLabel">レンズ</span>
      <div class="modeToggle" id="camGroup"></div>
      <div class="miniLabel" id="resReadout">RES —</div>
    </div>

    <div class="rowline" id="analysisRow">
      <span class="miniLabel">積算</span>
      <div class="modeToggle" id="stackGroup">
        <button type="button" data-stack="1">1</button>
        <button type="button" data-stack="4" class="active">4</button>
        <button type="button" data-stack="8">8</button>
      </div>
      <span class="miniLabel">平滑</span>
      <div class="modeToggle" id="blurGroup">
        <button type="button" data-blur="0">切</button>
        <button type="button" data-blur="1">弱</button>
        <button type="button" data-blur="3" class="active">中</button>
        <button type="button" data-blur="6">強</button>
      </div>
    </div>

    <div class="rowline" id="zoomRow">
      <span class="miniLabel">ズーム</span>
      <input type="range" id="zoomSlider" min="100" max="400" value="100" step="5">
      <span class="miniLabel" id="zoomVal">1.0×</span>
    </div>

    <div class="rowline" id="fusionRow">
      <span class="miniLabel">質感合成</span>
      <input type="range" id="fusionSlider" min="0" max="100" value="35">
      <span class="miniLabel" id="fusionVal">35%</span>
    </div>

    <div class="rowline" id="brightnessRow">
      <span class="miniLabel">輝度補正</span>
      <input type="range" id="brightnessSlider" min="-50" max="100" value="0">
      <span class="miniLabel" id="brightnessVal">0%</span>
    </div>

    <div id="shutterRow">
      <button type="button" class="iconBtn" id="switchCamBtn" title="カメラ切替">⟳</button>
      <button type="button" id="shutterBtn"><span id="shutterIcon">↺</span></button>
      <button type="button" class="iconBtn" id="saveBtn" title="保存" disabled>↓</button>
    </div>
  </div>

</div>

<div id="toast"></div>
<a id="dlLink"></a>

<script>
(function(){
  const video = document.getElementById('video');
  const viewCanvas = document.getElementById('viewCanvas');
  const workCanvas = document.getElementById('workCanvas');
  const vctx = viewCanvas.getContext('2d', { willReadFrequently: true });
  const wctx = workCanvas.getContext('2d', { willReadFrequently: true });

  const shutterBtn = document.getElementById('shutterBtn');
  const switchCamBtn = document.getElementById('switchCamBtn');
  const saveBtn = document.getElementById('saveBtn');
  const modeRGBtn = document.getElementById('modeRG');
  const modeRBBtn = document.getElementById('modeRB');
  const modeReadout = document.getElementById('modeReadout');
  const stateText = document.getElementById('stateText');
  const liveDot = document.getElementById('liveDot');
  const emptyHint = document.getElementById('emptyHint');
  const legend = document.getElementById('legend');
  const legendBar = document.getElementById('legendBar');
  const reticle = document.getElementById('reticle');
  const probeReadout = document.getElementById('probeReadout');
  const probeRatio = document.getElementById('probeRatio');
  const probeLevel = document.getElementById('probeLevel');
  const fusionSlider = document.getElementById('fusionSlider');
  const fusionVal = document.getElementById('fusionVal');
  const brightnessSlider = document.getElementById('brightnessSlider');
  const brightnessVal = document.getElementById('brightnessVal');
  const zoomReadout = document.getElementById('zoomReadout');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomVal = document.getElementById('zoomVal');
  const resReadout = document.getElementById('resReadout');
  const stackGroup = document.getElementById('stackGroup');
  const clipGroup = document.getElementById('clipGroup');
  const blurGroup = document.getElementById('blurGroup');
  const camRow = document.getElementById('camRow');
  const camGroup = document.getElementById('camGroup');
  const probeRGB = document.getElementById('probeRGB');
  const toast = document.getElementById('toast');
  const dlLink = document.getElementById('dlLink');

  let stream = null;
  let facingMode = 'environment';
  let mode = 'RG'; // or 'RB'
  let lastRatioMap = null;   // Float32Array of raw ratios (unclipped)
  let lastLuma = null;       // Float32Array normalized luminance 0..1
  let lastW = 0, lastH = 0;
  let lastLo = 0, lastHi = 1;
  let hasCapture = false;
  let isCapturing = false;

  // Processing width cap. Frame stacking holds the averaged RGB as Float32,
  // so memory is ~12 bytes/px on top of the ratio and luma maps; 1920 keeps a
  // 4K source well inside iOS Safari's budget. Fixed (not tied to the stack
  // count) so captures stay comparable with each other.
  const MAX_W = 1920;

  // frames averaged per capture — reduces sensor noise by ~1/sqrt(N), which is
  // what limits tonal resolution when shooting through heavy welding/cobalt glass
  let stackCount = 4;
  // percentile clip bounds for contrast stretching
  let clipLo = 0.02, clipHi = 0.98;
  // box-blur radius applied to the numerator/denominator channels *before* the
  // division. Averaging the channels raises the effective photon count per
  // sample, which matters far more than per-pixel sharpness when one channel
  // sits near the noise floor — a ratio of two noisy small numbers is garbage.
  let blurRadius = 3;

  let deviceId = null;   // selected camera, null = let the OS choose
  let zoomCap = null;    // hardware zoom range, when the track exposes one
  let hwZoom = false;    // true while zoom is handled by the camera, not by cropping

  // ---------- Zoom ----------
  // Hardware zoom keeps every sensor pixel on target; the digital fallback is a
  // centre crop, which throws away (1 - 1/z^2) of the sensor. Always prefer
  // hardware when the track advertises it.
  let zoomLevel = 1;

  function updateZoomVisual(){
    zoomVal.textContent = zoomLevel.toFixed(1) + '×' + (hwZoom ? '' : ' (D)');
    if (hwZoom){
      video.style.transform = 'none';
      const track = stream && stream.getVideoTracks()[0];
      if (track){
        track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }).catch(()=>{});
      }
    } else {
      video.style.transform = `scale(${zoomLevel})`;
    }
    if (zoomLevel > 1.02){
      zoomReadout.textContent = zoomLevel.toFixed(1) + '×' + (hwZoom ? '' : ' DIGITAL');
      zoomReadout.style.display = 'block';
    } else {
      zoomReadout.style.display = 'none';
    }
  }
  zoomSlider.addEventListener('input', ()=>{
    zoomLevel = parseInt(zoomSlider.value,10) / 100;
    updateZoomVisual();
  });

  // Reads the zoom capability of the live track and retargets the slider to it.
  function setupZoomForTrack(track){
    zoomCap = null; hwZoom = false;
    const caps = track.getCapabilities ? track.getCapabilities() : null;
    if (caps && caps.zoom && typeof caps.zoom.max === 'number' && caps.zoom.max > caps.zoom.min){
      zoomCap = caps.zoom;
      hwZoom = true;
      zoomSlider.min = Math.round(caps.zoom.min * 100);
      zoomSlider.max = Math.round(caps.zoom.max * 100);
      zoomLevel = caps.zoom.min;
    } else {
      zoomSlider.min = 100;
      zoomSlider.max = 400;
      zoomLevel = 1;
    }
    zoomSlider.value = Math.round(zoomLevel * 100);
    zoomSlider.disabled = false;
    updateZoomVisual();
  }

  // ---------- Camera (lens) selection ----------
  // Picking the telephoto module is real optical magnification: unlike digital
  // zoom it puts more sensor pixels on the target instead of fewer.
  function shortLensLabel(label){
    const l = (label || '').toLowerCase();
    if (l.includes('ultra') || label.includes('超広角')) return '超広角';
    if (l.includes('tele')  || label.includes('望遠'))  return '望遠';
    if (l.includes('front') || label.includes('前面') || label.includes('フロント')) return '前面';
    if (l.includes('dual')  || l.includes('triple') || label.includes('デュアル') || label.includes('トリプル')) return '自動';
    if (l.includes('back')  || label.includes('背面')) return '広角';
    return label ? label.slice(0, 6) : 'カメラ';
  }

  async function buildCameraPicker(){
    if (!navigator.mediaDevices.enumerateDevices) return;
    let devices = [];
    try { devices = await navigator.mediaDevices.enumerateDevices(); } catch { return; }
    const cams = devices.filter(d => d.kind === 'videoinput');
    // labels are only populated once permission has been granted
    if (cams.length < 2){ camRow.classList.add('hidden-el'); return; }

    camGroup.innerHTML = '';
    cams.forEach(cam => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = shortLensLabel(cam.label);
      b.dataset.id = cam.deviceId;
      if (cam.deviceId === deviceId) b.classList.add('active');
      camGroup.appendChild(b);
    });
    camRow.classList.remove('hidden-el');
  }

  camGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn || isCapturing) return;
    deviceId = btn.dataset.id;
    selectInGroup(camGroup, btn);
    startCamera();
  });

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  // ---------- Inferno-ish colormap ----------
  const stops = [
    [0.00,   0,   0,   4],
    [0.13,  31,  12,  72],
    [0.25,  85,  15, 109],
    [0.38, 136,  34, 106],
    [0.50, 186,  54,  85],
    [0.63, 227,  89,  51],
    [0.75, 249, 140,  10],
    [0.87, 249, 201,  50],
    [1.00, 252, 255, 164]
  ];
  function colormap(t){
    if (t <= 0) return stops[0].slice(1);
    if (t >= 1) return stops[stops.length-1].slice(1);
    for (let i=0; i<stops.length-1; i++){
      const a = stops[i], b = stops[i+1];
      if (t >= a[0] && t <= b[0]){
        const f = (t - a[0]) / (b[0] - a[0]);
        return [
          a[1] + (b[1]-a[1])*f,
          a[2] + (b[2]-a[2])*f,
          a[3] + (b[3]-a[3])*f
        ];
      }
    }
    return [255,255,255];
  }
  // Precomputed colormap lookup — the per-pixel stop scan above is too slow
  // once the processing resolution is in the megapixel range.
  const LUT_N = 1024;
  const cmapLUT = new Float32Array(LUT_N * 3);
  for (let i=0; i<LUT_N; i++){
    const c = colormap(i/(LUT_N-1));
    cmapLUT[i*3] = c[0]; cmapLUT[i*3+1] = c[1]; cmapLUT[i*3+2] = c[2];
  }

  function buildLegendGradient(){
    let css = 'linear-gradient(to top,';
    const n = 12;
    for (let i=0;i<=n;i++){
      const t = i/n;
      const c = colormap(t);
      css += ` rgb(${c[0]|0},${c[1]|0},${c[2]|0}) ${ (t*100).toFixed(0) }%${ i<n? ',':''}`;
    }
    css += ')';
    legendBar.style.background = css;
  }
  buildLegendGradient();

  // ---------- Camera ----------
  async function startCamera(){
    stopCamera();
    stateText.textContent = 'STARTING';
    try {
      const videoConstraints = {
        // ask for the highest sensor resolution available; `ideal` degrades
        // gracefully on devices that cannot deliver 4K
        width: { ideal: 3840 },
        height: { ideal: 2160 },
        // a high frame rate would shorten exposure, but on iOS the 60fps
        // modes are lower resolution — exposure is handled by physical
        // filtering, so resolution wins here
        frameRate: { ideal: 30 }
      };
      // an explicit lens choice must win over facingMode, which would otherwise
      // send us back to the default wide camera
      if (deviceId) videoConstraints.deviceId = { exact: deviceId };
      else videoConstraints.facingMode = { ideal: facingMode };

      stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
      video.srcObject = stream;

      const track = stream.getVideoTracks()[0];

      // report what the device actually granted — the 4K request is only an
      // `ideal`, so this is the way to confirm the resolution in the field
      const st = track.getSettings();
      resReadout.textContent = (st.width && st.height) ? `SRC ${st.width}×${st.height}` : 'SRC —';
      if (st.deviceId) deviceId = st.deviceId;

      setupZoomForTrack(track);
      buildCameraPicker();

      video.classList.remove('hidden');
      viewCanvas.classList.add('hidden');
      hasCapture = false;
      saveBtn.disabled = true;
      legend.style.display = 'none';
      probeReadout.style.display = 'none';
      reticle.style.display = 'none';
      emptyHint.style.display = 'none';
      liveDot.classList.add('live');
      stateText.textContent = 'LIVE';
      shutterBtn.classList.remove('analyzing');
      shutterBtn.classList.remove('retake');
    } catch (err){
      stateText.textContent = 'NO CAMERA';
      liveDot.classList.remove('live');
      emptyHint.style.display = 'flex';
      emptyHint.innerHTML = 'カメラにアクセスできませんでした。<br>Safariの設定でカメラの利用を許可してください。<br><span style="color:#8a9096;font-family:monospace;font-size:10px;">' + (err && err.message ? err.message : '') + '</span>';
      console.error(err);
    }
  }
  function stopCamera(){
    if (stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }

  switchCamBtn.addEventListener('click', ()=>{
    if (isCapturing) return; // swapping the source mid-stack would mix two scenes
    facingMode = (facingMode === 'environment') ? 'user' : 'environment';
    startCamera();
  });

  modeRGBtn.addEventListener('click', ()=>{
    if (mode==='RG') return;
    mode='RG'; modeRGBtn.classList.add('active'); modeRBBtn.classList.remove('active');
    modeReadout.textContent = 'MODE: R/G';
    if (hasCapture) reprocessFromRaw();
  });
  modeRBBtn.addEventListener('click', ()=>{
    if (mode==='RB') return;
    mode='RB'; modeRBBtn.classList.add('active'); modeRGBtn.classList.remove('active');
    modeReadout.textContent = 'MODE: R/B';
    if (hasCapture) reprocessFromRaw();
  });

  function selectInGroup(group, btn){
    group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  stackGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    stackCount = parseInt(btn.dataset.stack, 10);
    selectInGroup(stackGroup, btn);
  });

  clipGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    clipLo = parseFloat(btn.dataset.lo);
    clipHi = parseFloat(btn.dataset.hi);
    selectInGroup(clipGroup, btn);
    // clip bounds only affect the contrast stretch, so a reprocess is enough
    if (hasCapture) reprocessFromRaw();
  });

  blurGroup.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    blurRadius = parseInt(btn.dataset.blur, 10);
    selectInGroup(blurGroup, btn);
    if (hasCapture) reprocessFromRaw();
  });

  // averaged RGB of the captured frames, kept as Float32 so mode switches can
  // be reprocessed without recapturing and so stacking retains sub-LSB detail
  let rawRGB = null;

  const delay = (ms) => new Promise(r => setTimeout(r, ms));
  const nextPaint = () => new Promise(r => requestAnimationFrame(()=> requestAnimationFrame(r)));

  // ---------- Capture & process ----------
  shutterBtn.addEventListener('click', ()=>{
    if (isCapturing) return;
    if (hasCapture){ startCamera(); return; }
    if (!stream){ showToast('カメラが起動していません'); return; }
    captureAndProcess();
  });

  async function captureAndProcess(){
    isCapturing = true;
    try {
      await runCapture();
    } catch (err){
      console.error(err);
      showToast('解析に失敗しました（積算枚数を下げてください）');
      stateText.textContent = 'LIVE';
      shutterBtn.classList.remove('analyzing');
    } finally {
      // must always clear, or the shutter stays permanently dead
      isCapturing = false;
    }
  }

  async function runCapture(){
    shutterBtn.classList.add('analyzing');
    stateText.textContent = 'PROCESSING';

    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh){
      showToast('映像の取得に失敗しました');
      shutterBtn.classList.remove('analyzing');
      stateText.textContent = 'LIVE';
      return;
    }

    // Crop to the region visible under digital zoom, so the analyzed image
    // matches what was framed. Under hardware zoom the frame is already the
    // zoomed view, and cropping again would throw away sensor pixels twice.
    const crop = hwZoom ? 1 : zoomLevel;
    const cropW = vw / crop;
    const cropH = vh / crop;
    const cropX = (vw - cropW) / 2;
    const cropY = (vh - cropH) / 2;

    const scale = Math.min(1, MAX_W / cropW);
    const w = Math.round(cropW * scale);
    const h = Math.round(cropH * scale);

    workCanvas.width = w;
    workCanvas.height = h;
    lastW = w; lastH = h;

    const n = w * h;
    const accum = new Float32Array(n * 3);
    const frames = stackCount;

    for (let f = 0; f < frames; f++){
      if (frames > 1) stateText.textContent = `STACK ${f+1}/${frames}`;
      await nextPaint();
      wctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, w, h);
      const d = wctx.getImageData(0, 0, w, h).data;
      for (let i=0, p=0, q=0; i<n; i++, p+=4, q+=3){
        accum[q]   += d[p];
        accum[q+1] += d[p+1];
        accum[q+2] += d[p+2];
      }
      // let the camera deliver a genuinely new frame before the next read
      if (f < frames - 1) await delay(45);
    }

    const inv = 1 / frames;
    for (let i=0; i<accum.length; i++) accum[i] *= inv;
    rawRGB = accum;

    stateText.textContent = 'PROCESSING';
    await nextPaint();
    processCurrentRaw();
  }

  // Separable box blur with a running sum — O(n) regardless of radius.
  // `dst` may alias `src`: the vertical pass only ever reads the scratch buffer.
  let blurScratch = null;
  function boxBlurInto(src, dst, w, h, radius){
    if (radius <= 0){ if (dst !== src) dst.set(src); return dst; }
    if (!blurScratch || blurScratch.length < w*h) blurScratch = new Float32Array(w*h);
    const tmp = blurScratch;
    const win = radius*2 + 1;
    const cx = (x) => x < 0 ? 0 : (x > w-1 ? w-1 : x);
    const cy = (y) => y < 0 ? 0 : (y > h-1 ? h-1 : y);

    for (let y=0; y<h; y++){
      const row = y*w;
      let sum = 0;
      for (let k=-radius; k<=radius; k++) sum += src[row + cx(k)];
      for (let x=0; x<w; x++){
        tmp[row+x] = sum / win;
        sum += src[row + cx(x+radius+1)] - src[row + cx(x-radius)];
      }
    }
    for (let x=0; x<w; x++){
      let sum = 0;
      for (let k=-radius; k<=radius; k++) sum += tmp[cy(k)*w + x];
      for (let y=0; y<h; y++){
        dst[y*w+x] = sum / win;
        sum += tmp[cy(y+radius+1)*w + x] - tmp[cy(y-radius)*w + x];
      }
    }
    return dst;
  }

  function computeRatioAndLuma(rgb, w, h, useMode, radius){
    const n = w*h;
    const num = new Float32Array(n);   // R
    const den = new Float32Array(n);   // G or B
    const luma = new Float32Array(n);
    for (let i=0, q=0; i<n; i++, q+=3){
      const r = rgb[q], g = rgb[q+1], b = rgb[q+2];
      num[i] = r;
      den[i] = (useMode === 'RG') ? g : b;
      // luma is deliberately taken from the *unblurred* data, so the texture
      // fusion slider can put sharp surface detail back over a smooth field
      luma[i] = (0.299*r + 0.587*g + 0.114*b) / 255;
    }

    // Blur the channels, not the ratio. r/g of two independently noisy small
    // numbers has heavy-tailed, biased noise that no amount of post-smoothing
    // fixes; averaging the channels first is what actually raises SNR.
    boxBlurInto(num, num, w, h, radius);
    boxBlurInto(den, den, w, h, radius);

    // small enough not to distort ratios in the dark values that heavy optical
    // filtering produces, but still guards against division by zero
    const eps = 1;
    // reuse `num` as the output — index i is read before it is overwritten
    for (let i=0; i<n; i++) num[i] = num[i] / (den[i] + eps);
    return { ratio: num, luma };
  }

  function percentileClip(arr, loP, hiP){
    const n = arr.length;
    const step = Math.max(1, Math.floor(n/40000)); // sample for speed
    const sample = [];
    for (let i=0; i<n; i+=step) sample.push(arr[i]);
    sample.sort((a,b)=>a-b);
    const lo = sample[Math.floor(sample.length*loP)];
    const hi = sample[Math.min(sample.length-1, Math.floor(sample.length*hiP))];
    return [lo, hi];
  }

  function processCurrentRaw(){
    const { ratio, luma } = computeRatioAndLuma(rawRGB, lastW, lastH, mode, blurRadius);
    lastRatioMap = ratio;
    lastLuma = luma;
    const [lo, hi] = percentileClip(ratio, clipLo, clipHi);
    lastLo = lo; lastHi = (hi > lo) ? hi : lo + 1e-6;
    renderPseudocolor();

    hasCapture = true;
    saveBtn.disabled = false;
    legend.style.display = 'flex';
    probeReadout.style.display = 'block';
    reticle.style.display = 'block';
    reticle.style.left = '50%';
    reticle.style.top = '50%';
    updateProbeAtNorm(0.5, 0.5);

    video.classList.add('hidden');
    viewCanvas.classList.remove('hidden');
    zoomReadout.style.display = 'none';
    zoomSlider.disabled = true;
    stateText.textContent = 'CAPTURED';
    resReadout.textContent = `解析 ${lastW}×${lastH}`;
    liveDot.classList.remove('live');
    shutterBtn.classList.remove('analyzing');
    shutterBtn.classList.add('retake');
    showToast('解析完了 — シャッターボタンでライブに戻れます');
  }

  function reprocessFromRaw(){
    if (!rawRGB) return;
    stateText.textContent = 'PROCESSING';
    requestAnimationFrame(()=> requestAnimationFrame(processCurrentRaw));
  }

  const fusionAmountGetter = () => parseInt(fusionSlider.value,10)/100;
  const brightnessGainGetter = () => 1 + (parseInt(brightnessSlider.value,10)/100);
  const clamp255 = (v) => v<0 ? 0 : (v>255 ? 255 : v);

  function renderPseudocolor(){
    const w = lastW, h = lastH;
    viewCanvas.width = w; viewCanvas.height = h;
    const out = vctx.createImageData(w, h);
    const od = out.data;
    const f = fusionAmountGetter();
    const gain = brightnessGainGetter();
    const invRange = 1 / (lastHi - lastLo);
    for (let i=0, p=0; i<w*h; i++, p+=4){
      let t = (lastRatioMap[i] - lastLo) * invRange;
      if (t<0) t=0; else if (t>1) t=1;
      const li = ((t * (LUT_N-1)) + 0.5) | 0;
      const c0 = cmapLUT[li*3], c1 = cmapLUT[li*3+1], c2 = cmapLUT[li*3+2];
      // texture fusion: blend colormap with local luminance to retain surface detail
      const lumaMix = 0.55 + 0.9*lastLuma[i]; // keep colors visible, modulate by brightness
      const mix = (1-f) + lumaMix*f;
      // brightness correction applies to the final displayed image (independent
      // of fusion amount), so it also has an effect at 0% texture fusion
      od[p]   = clamp255(c0 * mix * gain);
      od[p+1] = clamp255(c1 * mix * gain);
      od[p+2] = clamp255(c2 * mix * gain);
      od[p+3] = 255;
    }
    vctx.putImageData(out, 0, 0);
  }

  fusionSlider.addEventListener('input', ()=>{
    fusionVal.textContent = fusionSlider.value + '%';
    if (hasCapture) renderPseudocolor();
  });

  brightnessSlider.addEventListener('input', ()=>{
    const v = parseInt(brightnessSlider.value,10);
    brightnessVal.textContent = (v>0?'+':'') + v + '%';
    if (hasCapture) renderPseudocolor();
  });

  // ---------- Probe (tap to inspect) ----------
  function clientToCanvasNorm(clientX, clientY){
    const rect = viewCanvas.getBoundingClientRect();
    // object-fit: contain -> compute letterboxed drawn area
    const cw = viewCanvas.width, ch = viewCanvas.height;
    const boxW = rect.width, boxH = rect.height;
    const scale = Math.min(boxW/cw, boxH/ch);
    const drawW = cw*scale, drawH = ch*scale;
    const offX = (boxW - drawW)/2, offY = (boxH - drawH)/2;
    const x = clientX - rect.left - offX;
    const y = clientY - rect.top - offY;
    if (x<0 || y<0 || x>drawW || y>drawH) return null;
    return { nx: x/drawW, ny: y/drawH, screenX: clientX - rect.left, screenY: clientY - rect.top };
  }

  function updateProbeAtNorm(nx, ny){
    if (!lastRatioMap) return;
    const px = Math.min(lastW-1, Math.max(0, Math.round(nx*lastW)));
    const py = Math.min(lastH-1, Math.max(0, Math.round(ny*lastH)));
    const idx = py*lastW + px;
    const r = lastRatioMap[idx];
    let level = (r - lastLo) / (lastHi - lastLo);
    level = Math.min(1, Math.max(0, level));
    probeRatio.textContent = r.toFixed(3);
    probeLevel.textContent = (level*100).toFixed(0) + '%';

    // Raw sensor levels at this point. If the numerator channel is only a few
    // counts out of 255 the ratio is quantization noise, not temperature —
    // that means the optical filter is eating the channel the method needs.
    if (rawRGB){
      const q = idx*3;
      const rr = rawRGB[q], gg = rawRGB[q+1], bb = rawRGB[q+2];
      probeRGB.textContent = `${rr.toFixed(0)} / ${gg.toFixed(0)} / ${bb.toFixed(0)}`;
      probeRGB.classList.toggle('lowSignal', rr < 12);
    }
  }

  document.getElementById('stage').addEventListener('click', (e)=>{
    if (!hasCapture) return;
    const hit = clientToCanvasNorm(e.clientX, e.clientY);
    if (!hit) return;
    reticle.style.left = hit.screenX + 'px';
    reticle.style.top = hit.screenY + 'px';
    updateProbeAtNorm(hit.nx, hit.ny);
  });

  // ---------- Save ----------
  saveBtn.addEventListener('click', ()=>{
    if (!hasCapture) return;
    viewCanvas.toBlob((blob)=>{
      const url = URL.createObjectURL(blob);
      dlLink.href = url;
      const ts = new Date().toISOString().replace(/[:.]/g,'-');
      dlLink.download = `refractory-scope_${mode}_${ts}.png`;
      dlLink.click();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast('画像を保存しました');
    }, 'image/png');
  });

  // ---------- retake on tapping video again handled by shutter; add long-press hint ----------
  video.addEventListener('click', ()=>{
    // tapping the live view just re-focuses attention to shutter; no-op
  });

  // restart live view: double-tap on captured image? Provide via switch cam? simplest: tap saveBtn area not video.
  // Add explicit "retake" by tapping reticle area twice quickly is confusing -> add keyboard-free simple rule:
  viewCanvas.addEventListener('dblclick', ()=>{
    startCamera();
  });

  startCamera();
})();
</script>
</body>
</html>
